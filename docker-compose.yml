services:
  postgresdb:
    image: postgres:latest
    container_name: postgresdb
    environment:
      POSTGRES_DB: jeekdb
      POSTGRES_USER: jeekuser
      POSTGRES_PASSWORD: jeekpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_NAME: postgresql://jeekuser:jeekpassword@postgresdb:5432/jeekdb?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - app-network
      - observability
    depends_on:
      - postgresdb

  keycloak:
    image: keycloak/keycloak:nightly
    container_name: keycloak-auth
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_DB: postgresdb
      KC_DB_URL_HOST: postgresdb
      KC_DB_URL_PORT: 5432
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: jeek_user
      KC_DB_PASSWORD: jeek_password
    command:
      - start-dev
    ports:
      - "8080:8080"
    networks:
      - app-network
      - observability
    depends_on:
      - postgresdb
  backend:
    build: 
      context: ./backend-service
      dockerfile: Dockerfile
    container_name: spring-backend
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresdb:5432/jeekdb
      - SPRING_DATASOURCE_USERNAME=jeekuser
      - SPRING_DATASOURCE_PASSWORD=jeekpassword
    ports:
      - "8081:8080"
    networks:
      - app-network
      - observability
    depends_on:
      - postgresdb

  frontend:
    build: 
      context: ./frontend-service
      dockerfile: Dockerfile
    container_name: angular-frontend
    ports:
      - "4200:80"
    networks:
      - app-network
      - observability
    depends_on:
      - backend

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.1
    container_name: nginx-exporter
    command:
      - --nginx.scrape-uri=http://angular-frontend:8080/stub_status
    ports:
      - "9113:9113"
    depends_on:
      - frontend
    networks:
      - observability

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - observability

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - observability

  jaeger:
    image: jaegertracing/all-in-one
    container_name: jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - observability

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
  observability:
    driver: bridge